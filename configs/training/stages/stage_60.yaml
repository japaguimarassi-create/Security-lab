base_model: Qwen/Qwen3-1.7B-Base
previous_adapter: outputs/previous-stage-adapter
dataset_path: data/processed/teacher_approved.jsonl
require_approval: true
minimum_examples: 20
require_cuda: false
optim: adamw_torch
stage_percent: 60
stage_index: 3
stage_total: 5
output_dir: outputs/klod-stage-60
max_sequence_length: 512
num_train_epochs: 1
max_steps: -1
learning_rate: 0.00002
warmup_ratio: 0.05
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
validation_ratio: 0.10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_in_4bit: false
bf16: false
fp16: false
packing: false
seed: 44
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
