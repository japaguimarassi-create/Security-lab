base_model: outputs/klod-continued-pretraining
dataset_path: data/processed/sft.jsonl
output_dir: outputs/klod-sft
max_sequence_length: 4096
max_steps: 3000
learning_rate: 0.00005
warmup_ratio: 0.03
weight_decay: 0.01
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
logging_steps: 10
save_steps: 250
save_total_limit: 3
bf16: true
fp16: false
gradient_checkpointing: true
use_lora: true
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
seed: 42
