name: BlocoVivo Forge 1.7.10 build

on:
  push:
    branches:
      - stevebo-forge-1.7.10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy pillow

      - name: Set up Gradle 4.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.5'

      - name: Build with bounded retries
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if gradle --no-daemon clean build --stacktrace 2>&1 | tee "build-logs/attempt-${attempt}.log"; then
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying after preserving its log."
            sleep 3
          done
          echo "All build attempts failed."
          exit 1

      - name: Verify installable JAR
        run: |
          test -f build/libs/BlocoVivo-0.1.0.jar
          jar tf build/libs/BlocoVivo-0.1.0.jar | grep -q 'mcmod.info'
          jar tf build/libs/Stevebo-0.1.0.jar | grep -q 'br/com/japaguimarassi/stevebo/SteveboMod.class'

      - name: Upload mod and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlocoVivo-Forge-1.7.10-build
          path: |
            build/libs/*.jar
            build-logs/*.log
          if-no-files-found: warn
