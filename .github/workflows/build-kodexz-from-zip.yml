name: Import Kodexz Android v6 and build APK

on:
  workflow_dispatch:
  push:
    branches: [kodexz-android]
    paths:
      - 'Kodexz_Android_v6_Source.zip'

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify Android v6 source archive
        run: test -f Kodexz_Android_v6_Source.zip

      - name: Extract and validate Android v6 source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Kodexz_Android_v6_Source.zip -d source
          PROJECT="source/Kodexz_Android_v6"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/java/com/kodexz/app/MainActivity.java"
          test -f "$PROJECT/app/src/main/assets/public/index.html"
          test -f "$PROJECT/app/src/main/assets/public/model.js"
          grep -Eq "versionCode[[:space:]]+6" "$PROJECT/app/build.gradle"
          grep -Eq "versionName[[:space:]]+'6\\.0\\.0'" "$PROJECT/app/build.gradle"
          test "$(wc -c < "$PROJECT/app/src/main/assets/public/model.js")" -gt 100000
          mkdir -p Kodexz_Android_v6
          rsync -a --delete "$PROJECT/" Kodexz_Android_v6/
          printf 'Validated Kodexz Android version: '
          grep -E "version(Name|Code)" Kodexz_Android_v6/app/build.gradle | tr '\n' ' '
          echo

      - name: Validate JavaScript and Android project structure
        working-directory: Kodexz_Android_v6
        run: bash tools-check.sh

      - name: Commit the actual source files to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Kodexz_Android_v6
          if git diff --cached --quiet; then
            echo "Android v6 source directory is already up to date."
          else
            git commit -m "Import Kodexz Android v6 source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Kodexz Android v6
        working-directory: Kodexz_Android_v6
        run: gradle --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodexz-Android-v6-debug-APK
          path: Kodexz_Android_v6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
