name: Build Kodexz Android from source ZIP

on:
  workflow_dispatch:
  push:
    branches: [kodexz-android]
    paths:
      - 'Kodexz_Android_v6_Source.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Verify source archive exists
        run: test -f Kodexz_Android_v6_Source.zip

      - name: Extract source archive
        run: unzip -q Kodexz_Android_v6_Source.zip -d source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: source/Kodexz_Android_v6
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodexz-Android-debug-APK
          path: source/Kodexz_Android_v6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
