name: Android APK

on:
  push:
    branches:
      - voxelforge-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Three.js runtime
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund
          mkdir -p app/src/main/assets/game/vendor
          cp node_modules/three/build/three.module.js app/src/main/assets/game/vendor/three.module.js

      - name: Validate game JavaScript
        run: node --check app/src/main/assets/game/main.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.voxelforge.arena.debug'"
          sha256sum "$APK" | tee apk-sha256.txt
          echo "APK validation passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voxelforge-arena-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
