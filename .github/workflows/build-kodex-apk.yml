name: Build Kodex Android APK 0.4.0

on:
  push:
    branches:
      - kodex-programming-ai
    paths:
      - "android-app/**"
      - "index.html"
      - "workspace.html"
      - "workspace.css"
      - "src/workspace/**"
      - "tests/workspace.test.mjs"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "styles.css"
      - "app.js"
      - "package.json"
      - "README.md"
      - "src/ai/mobile-mlm.js"
      - "src/ai/neuron-profile.json"
      - "training/build_mobile_mlm.py"
      - "training/data/mobile_dialogue.jsonl"
      - "training/tests/test_mobile_mlm.py"
      - "tests/neuron-profile.test.mjs"
      - ".github/workflows/build-kodex-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript sources and run regression tests
        run: |
          npm run check
          npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch CPU
        run: python -m pip install --upgrade pip && python -m pip install numpy && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate and test mobile language model
        run: |
          python -m py_compile training/build_mobile_mlm.py
          python -m unittest training.tests.test_mobile_mlm -v

      - name: Train unchanged 264,192-parameter local model from scratch
        run: python training/build_mobile_mlm.py --data training/data/mobile_dialogue.jsonl --output kodex-model.js --steps 500 --batch-size 8 --seed 42

      - name: Verify exported model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("kodex-model.js").read_text(encoding="utf-8")
          prefix = "window.KODEX_MLM_DATA="
          if not raw.startswith(prefix) or not raw.rstrip().endswith(";"):
              raise SystemExit("Model export has an invalid JavaScript wrapper")
          model = json.loads(raw[len(prefix):].strip().removesuffix(";"))
          assert model["parameterCount"] == 264192, model.get("parameterCount")
          assert len(model["merges"]) == 256, len(model["merges"])
          assert len(model["tensors"]) >= 9
          print("MLM export valid:", model["parameterCount"], "parameters;", len(model["merges"]), "BPE merges")
          print("Training metrics:", model["training"])
          print("Export size:", Path("kodex-model.js").stat().st_size, "bytes")
          PY

      - name: Smoke-test on-device inference
        run: |
          node - <<'JS'
          global.window = {};
          require("./kodex-model.js");
          require("./src/ai/mobile-mlm.js");
          const runtime = window.KodexMobileMLM;
          if (!runtime || !runtime.ready || runtime.metadata.parameterCount !== 264192) {
            throw new Error("Local language model did not initialize correctly");
          }
          const reply = runtime.generate("me explique uma variável", "chat", { maxNewTokens: 24 });
          if (typeof reply !== "string") throw new Error("Inference did not return text");
          console.log("Local inference smoke result:", JSON.stringify(reply));
          JS

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace -p android-app assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kodex-Android-APK-v0.4.0
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
