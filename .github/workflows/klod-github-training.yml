name: KLOD GitHub CPU staged training

on:
  push:
    branches:
      - development
      - training/**
    paths:
      - "data/github/run-request.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: klod-github-cpu-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.request.outputs.phase }}
      stage_percent: ${{ steps.request.outputs.stage_percent }}
      teacher_run_id: ${{ steps.request.outputs.teacher_run_id }}
      previous_stage_run_id: ${{ steps.request.outputs.previous_stage_run_id }}
      previous_stage_percent: ${{ steps.request.outputs.previous_stage_percent }}
      approved_ids: ${{ steps.request.outputs.approved_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML
      - name: Validate the GitHub training request
        id: request
        run: python scripts/github_training.py validate-request --request data/github/run-request.json

  execute:
    needs: validate
    if: needs.validate.outputs.phase != 'setup'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KLOD_FORCE_CPU: "1"
      KLOD_CPU_THREADS: "4"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PHASE: ${{ needs.validate.outputs.phase }}
      STAGE_PERCENT: ${{ needs.validate.outputs.stage_percent }}
      TEACHER_RUN_ID: ${{ needs.validate.outputs.teacher_run_id }}
      PREVIOUS_STAGE_RUN_ID: ${{ needs.validate.outputs.previous_stage_run_id }}
      PREVIOUS_STAGE_PERCENT: ${{ needs.validate.outputs.previous_stage_percent }}
      APPROVED_IDS_JSON: ${{ needs.validate.outputs.approved_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect the free public runner
        run: |
          set -euo pipefail
          echo "CPU threads: $(nproc)"
          free -h
          df -h /
          test "$(nproc)" -ge 2
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
      - name: Install KLOD CPU training dependencies
        run: python -m pip install --no-cache-dir -e ".[training-cpu]"
      - name: Verify CPU-only runtime
        run: |
          python - <<'PY'
          import torch
          assert not torch.cuda.is_available(), "Expected CPU-only PyTorch."
          torch.set_num_threads(4)
          print({"torch": torch.__version__, "cuda": torch.cuda.is_available(), "threads": torch.get_num_threads()})
          PY
      - name: Prove Qwen3-1.7B LoRA backward pass fits the runner
        if: env.PHASE == 'cpu_smoke'
        run: python scripts/cpu_training_smoke.py --threads 4
      - name: Validate teacher data and CPU settings
        if: env.PHASE == 'generate'
        run: python scripts/training_preflight.py --stage teacher --config configs/training/distillation.yaml
      - name: Generate frozen-teacher candidates on CPU
        if: env.PHASE == 'generate'
        run: |
          python scripts/generate_teacher_data.py --config configs/training/distillation.yaml
          python scripts/github_training.py record-generation
      - name: Upload teacher candidates for human review
        if: env.PHASE == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: klod-teacher-candidates
          path: |
            data/generated/teacher_candidates.jsonl
            data/generated/teacher_run.json
          if-no-files-found: error
          retention-days: 14
      - name: Download reviewed teacher candidates
        if: env.PHASE == 'train_stage'
        uses: actions/download-artifact@v4
        with:
          name: klod-teacher-candidates
          path: .klod-candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TEACHER_RUN_ID }}
      - name: Download previous stage adapter
        if: env.PHASE == 'train_stage' && env.STAGE_PERCENT != '20'
        uses: actions/download-artifact@v4
        with:
          name: klod-stage-${{ env.PREVIOUS_STAGE_PERCENT }}-adapter
          path: .klod-previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREVIOUS_STAGE_RUN_ID }}
      - name: Prepare approved data and stage configs
        if: env.PHASE == 'train_stage'
        shell: bash
        run: |
          set -euo pipefail
          previous_args=()
          if [ "$STAGE_PERCENT" != "20" ]; then
            previous_args+=(--previous-adapter-zip ".klod-previous/klod-stage-$PREVIOUS_STAGE_PERCENT-adapter.zip")
          fi
          python scripts/github_training.py prepare-stage \
            --request data/github/run-request.json \
            --branch "$GITHUB_REF_NAME" \
            --candidate-file .klod-candidates/teacher_candidates.jsonl \
            "${previous_args[@]}"
          python scripts/approve_teacher_data.py --minimum 20
          python scripts/training_preflight.py --stage sft --config configs/training/stages/runtime_stage.yaml
      - name: Train the incremental LoRA stage on CPU
        if: env.PHASE == 'train_stage'
        run: python scripts/train_sft.py --config configs/training/stages/runtime_stage.yaml
      - name: Run blinded teacher/student evaluation on CPU
        if: env.PHASE == 'train_stage'
        run: python scripts/evaluate_teacher_student.py --config configs/training/stages/runtime_eval.yaml
      - name: Package stage adapter and report
        if: env.PHASE == 'train_stage'
        run: python scripts/github_training.py package-stage --stage "$STAGE_PERCENT" --adapter-dir "outputs/klod-stage-$STAGE_PERCENT"
      - name: Upload adapter for the next branch
        if: env.PHASE == 'train_stage'
        uses: actions/upload-artifact@v4
        with:
          name: klod-stage-${{ env.STAGE_PERCENT }}-adapter
          path: output/klod-stage-${{ env.STAGE_PERCENT }}-adapter.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload stage results
        if: env.PHASE == 'train_stage'
        uses: actions/upload-artifact@v4
        with:
          name: klod-stage-${{ env.STAGE_PERCENT }}-report
          path: |
            output/klod-stage-${{ env.STAGE_PERCENT }}-results.zip
            output/RELATORIO_KLOD_${{ env.STAGE_PERCENT }}pct.md
            output/stage-${{ env.STAGE_PERCENT }}-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## KLOD GitHub CPU training"
            echo ""
            echo "- Phase: $PHASE"
            if [ "$PHASE" = "cpu_smoke" ]; then
              echo "- Qwen3-1.7B SFTTrainer smoke test executed."
            elif [ "$PHASE" = "generate" ]; then
              echo "- Teacher candidates: klod-teacher-candidates"
            elif [ "$PHASE" = "train_stage" ]; then
              echo "- Completed stage: $STAGE_PERCENT%"
              echo "- Adapter artifact: klod-stage-$STAGE_PERCENT-adapter"
              echo "- Report artifact: klod-stage-$STAGE_PERCENT-report"
            fi
            echo "- CPU-only; no paid runner required."
            echo "- GitHub run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
