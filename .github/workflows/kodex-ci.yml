name: Kodex CI

on:
  push:
    branches:
      - kodex-programming-ai
  pull_request:
    branches:
      - main
      - kodex-programming-ai

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test