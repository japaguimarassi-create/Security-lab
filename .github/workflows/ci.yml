name: KLOD and GPU Mesh CI
on:
  push:
    branches: [main, development, 'training/**', 'gpu-mesh/**']
  pull_request:
    branches: [main, gpu-mesh/core]
concurrency:
  group: klod-gpu-mesh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q src scripts examples/huggingface_zerogpu
      - run: node --check src/klod/web/app.js
      - run: python -c "import json; json.load(open('examples/colab/GPU_Mesh_Worker.ipynb', encoding='utf-8'))"
      - run: pytest -q
