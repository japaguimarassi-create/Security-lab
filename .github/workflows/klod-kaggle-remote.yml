name: KLOD Kaggle staged training

on:
  push:
    branches:
      - development
      - training/**
    paths:
      - "data/kaggle/run-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: klod-kaggle-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - name: Checkout the requested training branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Read and validate the stage request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path("data/kaggle/run-request.json").read_text())
          phase = request.get("phase")
          stage = request.get("stage_percent")
          teacher_run = request.get("teacher_run_id")
          previous_run = request.get("previous_stage_run_id")
          approved = request.get("approved_ids", [])
          branch = os.environ["GITHUB_REF_NAME"]

          if phase not in ("setup", "generate", "train_stage"):
              raise SystemExit("Invalid phase in data/kaggle/run-request.json")

          if phase == "generate" and branch != "development":
              raise SystemExit("Teacher generation must run from development.")

          previous_percent = None
          if phase == "train_stage":
              if stage not in (20, 40, 60, 80, 100):
                  raise SystemExit("stage_percent must be 20, 40, 60, 80, or 100.")
              expected_branch = f"training/{stage}-percent"
              if branch != expected_branch:
                  raise SystemExit(
                      f"Stage {stage}% must run from {expected_branch}, not {branch}."
                  )
              if not isinstance(teacher_run, (int, str)) or not str(teacher_run).isdigit():
                  raise SystemExit("teacher_run_id must reference the candidate-generation run.")
              if not isinstance(approved, list) or len(approved) < 20:
                  raise SystemExit("At least 20 manually reviewed IDs are required.")
              if len(approved) != len(set(approved)):
                  raise SystemExit("approved_ids cannot contain duplicates.")
              if stage == 20:
                  if previous_run not in (None, "", 0):
                      raise SystemExit("The 20% stage must not have a previous-stage run.")
              else:
                  if not isinstance(previous_run, (int, str)) or not str(previous_run).isdigit():
                      raise SystemExit("This stage requires previous_stage_run_id.")
                  previous_percent = stage - 20

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"phase={phase}\n")
              output.write(f"stage_percent={stage or ''}\n")
              output.write(f"teacher_run_id={teacher_run or ''}\n")
              output.write(f"previous_stage_run_id={previous_run or ''}\n")
              output.write(f"previous_stage_percent={previous_percent or ''}\n")
              output.write("approved_ids=" + json.dumps(approved, separators=(",", ":")) + "\n")
          PY
          echo "KAGGLE_USERNAME=${KAGGLE_USERNAME:-}" >> "$GITHUB_ENV"

      - name: Validate Kaggle credentials
        if: steps.request.outputs.phase != 'setup'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || {
            echo "Missing repository secret KAGGLE_API_TOKEN." >&2
            exit 1
          }
          test -n "$KAGGLE_USERNAME" || {
            echo "Missing repository variable KAGGLE_USERNAME." >&2
            exit 1
          }

      - name: Set up Python
        if: steps.request.outputs.phase != 'setup'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        if: steps.request.outputs.phase != 'setup'
        run: python -m pip install --upgrade kaggle

      - name: Verify Kaggle authentication
        if: steps.request.outputs.phase != 'setup'
        run: kaggle kernels list --mine --page-size 1

      - name: Generate teacher candidates on Kaggle
        if: steps.request.outputs.phase == 'generate'
        run: |
          python scripts/kaggle_github_runner.py generate \
            --username "$KAGGLE_USERNAME" \
            --output-dir output \
            --workdir /tmp/klod-kaggle \
            --max-wait-hours 5.5

      - name: Download reviewed teacher candidates
        if: steps.request.outputs.phase == 'train_stage'
        uses: actions/download-artifact@v4
        with:
          name: klod-teacher-candidates
          path: .klod-candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.teacher_run_id }}

      - name: Download previous stage adapter
        if: steps.request.outputs.phase == 'train_stage' && steps.request.outputs.stage_percent != '20'
        uses: actions/download-artifact@v4
        with:
          name: klod-stage-${{ steps.request.outputs.previous_stage_percent }}-adapter
          path: .klod-previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.previous_stage_run_id }}

      - name: Train the requested percentage stage on Kaggle
        if: steps.request.outputs.phase == 'train_stage'
        env:
          APPROVED_IDS_JSON: ${{ steps.request.outputs.approved_ids }}
          STAGE_PERCENT: ${{ steps.request.outputs.stage_percent }}
          PREVIOUS_STAGE_PERCENT: ${{ steps.request.outputs.previous_stage_percent }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            train_stage
            --username "$KAGGLE_USERNAME"
            --stage-percent "$STAGE_PERCENT"
            --candidate-file .klod-candidates/teacher_candidates.jsonl
            --approved-ids-json "$APPROVED_IDS_JSON"
            --output-dir output
            --workdir /tmp/klod-kaggle
            --max-wait-hours 5.5
          )
          if [ "$STAGE_PERCENT" != "20" ]; then
            args+=(--previous-adapter-zip ".klod-previous/klod-stage-${PREVIOUS_STAGE_PERCENT}-adapter.zip")
          fi
          python scripts/kaggle_github_runner.py "${args[@]}"

      - name: Upload teacher candidates for human review
        if: steps.request.outputs.phase == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: klod-teacher-candidates
          path: |
            output/teacher_candidates.jsonl
            output/teacher_run.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload this stage adapter for the next branch
        if: steps.request.outputs.phase == 'train_stage'
        uses: actions/upload-artifact@v4
        with:
          name: klod-stage-${{ steps.request.outputs.stage_percent }}-adapter
          path: output/klod-stage-${{ steps.request.outputs.stage_percent }}-adapter.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload this stage report
        if: steps.request.outputs.phase == 'train_stage'
        uses: actions/upload-artifact@v4
        with:
          name: klod-stage-${{ steps.request.outputs.stage_percent }}-report
          path: |
            output/klod-stage-${{ steps.request.outputs.stage_percent }}-results.zip
            output/RELATORIO_KLOD_${{ steps.request.outputs.stage_percent }}pct.txt
            output/stage-${{ steps.request.outputs.stage_percent }}-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        if: always()
        shell: bash
        env:
          PHASE: ${{ steps.request.outputs.phase }}
          STAGE: ${{ steps.request.outputs.stage_percent }}
        run: |
          {
            echo "## KLOD staged Kaggle training"
            echo ""
            echo "- Phase: $PHASE"
            if [ "$PHASE" = "generate" ]; then
              echo "- Teacher candidate artifact: klod-teacher-candidates"
            elif [ "$PHASE" = "train_stage" ]; then
              echo "- Completed stage target: $STAGE%"
              if [ "$STAGE" = "100" ]; then
                echo "- Final staged adapter produced."
              else
                echo "- Next branch: training/$((STAGE + 20))-percent"
              fi
              echo "- Adapter artifact: klod-stage-$STAGE-adapter"
            else
              echo "- Setup-only; no Kaggle GPU was requested."
            fi
            echo "- GitHub run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
