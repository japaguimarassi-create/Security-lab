name: Game-agent prototype CI
on:
  push:
    branches:
      - "game-agent/**"
  pull_request:
    branches: [main]
    paths:
      - "src/klod/game_agent/**"
      - "tests/test_game_agent.py"
      - "scripts/run_game_agent_experiment.py"
      - ".github/workflows/game-agent.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pytest
      - run: PYTHONPATH=src python -m pytest -q tests/test_game_agent.py
      - run: PYTHONPATH=src python -m compileall -q src/klod/game_agent scripts/run_game_agent_experiment.py
