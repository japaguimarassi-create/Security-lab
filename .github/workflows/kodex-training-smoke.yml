name: Kodex from-scratch training smoke test

on:
  push:
    branches:
      - kodex-programming-ai
    paths:
      - "training/**"
      - ".github/workflows/kodex-training-smoke.yml"
  pull_request:
    branches:
      - main
      - kodex-programming-ai
    paths:
      - "training/**"
      - ".github/workflows/kodex-training-smoke.yml"

permissions:
  contents: read

jobs:
  train-small-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install tokenizers
      - name: Validate Python source
        run: python -m py_compile training/kodex_lm.py training/train.py training/generate.py training/prepare_corpus.py training/train_tokenizer.py
      - name: Test corpus preparation policy
        run: python -m unittest discover -s training/tests -v
      - name: Train randomly initialized byte-level model
        run: python training/train.py --data training/data/smoke_corpus.txt --output /tmp/kodex-byte.pt --steps 5 --batch-size 2 --block-size 64 --layers 2 --heads 2 --embedding-size 32 --eval-interval 1 --device cpu
      - name: Reload byte-level checkpoint and generate sample
        run: python training/generate.py --checkpoint /tmp/kodex-byte.pt --prompt "def add(a, b):" --max-new-tokens 12 --top-k 8 --device cpu
      - name: Train tokenizer from scratch
        run: python training/train_tokenizer.py --data training/data/smoke_corpus.txt --output /tmp/kodex-tokenizer.json --vocab-size 512
      - name: Train randomly initialized BPE model
        run: python training/train.py --data training/data/smoke_corpus.txt --tokenizer /tmp/kodex-tokenizer.json --output /tmp/kodex-bpe.pt --steps 5 --batch-size 2 --block-size 64 --layers 2 --heads 2 --embedding-size 32 --eval-interval 1 --device cpu
      - name: Reload BPE checkpoint and generate sample
        run: python training/generate.py --checkpoint /tmp/kodex-bpe.pt --prompt "def add(a, b):" --max-new-tokens 12 --top-k 8 --device cpu
      - name: Verify checkpoints and tokenizer exist
        run: test -s /tmp/kodex-byte.pt && test -s /tmp/kodex-bpe.pt && test -s /tmp/kodex-tokenizer.json