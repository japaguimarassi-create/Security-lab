[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klod-ai"
version = "0.4.0"
description = "Klod multilingual LLM runtime, semantic retrieval, specialists and training toolkit"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
model = ["torch>=2.6", "transformers>=4.51", "accelerate>=1.2", "safetensors>=0.4", "peft>=0.14"]
embeddings = ["sentence-transformers>=4.1,<6"]
data = ["datasets>=3.2", "ftfy>=6.3"]
training = ["torch>=2.6", "transformers>=4.51", "accelerate>=1.2", "datasets>=3.2", "peft>=0.14", "trl>=0.20,<2", "bitsandbytes>=0.45", "PyYAML>=6"]
test = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.9", "PyYAML>=6"]
all = ["torch>=2.6", "transformers>=4.51", "accelerate>=1.2", "safetensors>=0.4", "peft>=0.14", "sentence-transformers>=4.1,<6", "datasets>=3.2", "ftfy>=6.3", "trl>=0.20,<2", "bitsandbytes>=0.45", "PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
