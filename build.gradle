buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.+'
    }
}

apply plugin: 'forge'

group = 'br.com.japaguimarassi.stevebo'
version = '0.1.0'
archivesBaseName = 'Stevebo'
sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

task trainAiModel(type: Exec) {
    commandLine 'python3', 'scripts/train_model.py'
    inputs.file 'data/minecraft_corpus.txt'
    outputs.files 'src/main/resources/assets/stevebo/ai/embeddings.bin',
                  'src/main/resources/assets/stevebo/ai/vocab.tsv'
}

processResources.dependsOn trainAiModel

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}
